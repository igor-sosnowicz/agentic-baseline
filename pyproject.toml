[project]
name = "agentic-baseline"
version = "0.1.0"
description = "The agentic system competing against Contradictor on its Golden Dataset."
readme = "README.md"
authors = [
    { name = "igor-sosnowicz", email = "igor@sosnowicz.eu" }
]
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.0",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.16",
    "mcp[cli]>=1.30.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
agentic-baseline = "agentic_baseline.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
